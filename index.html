<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0}img{max-width:100%}</style>
<title>5-Day Money Magic Challenge w/ Brie Sodano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Mulish:wght@400;600;700&display=swap">
<style>
/* layout: a slim control bar over two framed panes (original | edited); one pane at a time on narrow screens */
:root{
  --bg:#ece7dc; --panel:#f7f2e7; --ink:#201652; --muted:#5d5873; --line:#d6cdb8;
  --accent:#b37702; --accent-ink:#ffffff; --device:#10122b; --chip:#e3dccb;
  --display:"Gilda Display",Georgia,serif; --ui:Mulish,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d22; --panel:#14173a; --ink:#f1ecdf; --muted:#a8a3bb; --line:#2a2e5c;
  --accent:#f0c46d; --accent-ink:#10122b; --device:#000; --chip:#20244e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d22; --panel:#14173a; --ink:#f1ecdf; --muted:#a8a3bb; --line:#2a2e5c;
  --accent:#f0c46d; --accent-ink:#10122b; --device:#000; --chip:#20244e; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--ui);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

.bar{position:relative;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.bar h1{margin:0;font:400 20px/1.15 var(--display);letter-spacing:.2px;text-wrap:balance;margin-right:auto;min-width:0}
.bar h1 small{display:block;font:600 11px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.group{display:flex;align-items:center;gap:8px}
.group > span{font:700 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 13px/1 var(--ui);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--ui);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

.stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:18px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.pane header{display:flex;align-items:baseline;gap:10px}
.pane header b{font:400 18px/1.1 var(--display)}
.pane header em{font-style:normal;font:600 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.frame{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:14px;background:var(--device);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.frame iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:0 0}

/* phone device */
.stage.phone .frame{flex:1;width:min(100%,414px);margin:0 auto;border-radius:34px;padding:12px}
.stage.phone .frame iframe{top:12px;left:12px;border-radius:24px}

/* one pane at a time */
.stage.single{grid-template-columns:1fr}
.stage.single .pane[hidden]{display:none}
.solo{display:none}
@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .stage .pane.offstage{display:none}
  .solo{display:flex}
  .sidebyside{display:none}
}
</style>

</head>
<body>
<div class="bar">
  <h1>Money Magic opt-in page <small>Original vs edited · Draft for review</small></h1>
  <div class="group"><span>View as</span>
    <div class="seg" id="dev" role="group" aria-label="Screen size">
      <button type="button" data-d="phone" aria-pressed="true">Phone</button>
      <button type="button" data-d="desktop">Desktop</button>
    </div>
  </div>
  <div class="group solo"><span>Show</span>
    <div class="seg" id="pick" role="group" aria-label="Which page">
      <button type="button" data-p="orig">Original</button>
      <button type="button" data-p="edit" aria-pressed="true">Edited</button>
    </div>
  </div>
  <label class="check sidebyside"><input type="checkbox" id="sync"> Scroll together</label>
</div>

<main class="stage phone" id="stage">
  <section class="pane offstage" id="paneOrig" aria-label="Original page">
    <header><b>Original</b><em>The page as it is live today</em></header>
    <div class="frame"><iframe id="fOrig" title="Original page" src="original.html"></iframe></div>
  </section>
  <section class="pane" id="paneEdit" aria-label="Edited page">
    <header><b>Edited</b><em id="editLabel">With our changes</em></header>
    <div class="frame"><iframe id="fEdit" title="Edited page" src="edited.html#v3"></iframe></div>
  </section>
</main>

<script>
(function () {
  document.documentElement.setAttribute('data-cc-compare', '');
  var NAMES = { v3: 'With our changes' };
  var state = { v: 'v3', d: 'phone', p: 'edit' };
  try { var saved = JSON.parse(localStorage.getItem('cc-compare') || '{}'); for (var k in saved) if (k in state) state[k] = saved[k]; } catch (e) {}
  state.v = 'v3'; // one edited version for now; bring back a version picker only when there are options to choose

  var stage = document.getElementById('stage');
  var fOrig = document.getElementById('fOrig'), fEdit = document.getElementById('fEdit');
  var PHONE = { w: 390 }, DESK = { w: 1280 };

  function press(groupId, attr, val) {
    var bs = document.getElementById(groupId).querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', bs[i].getAttribute(attr) === val ? 'true' : 'false');
  }
  function fit() {
    [fOrig, fEdit].forEach(function (f) {
      var box = f.parentNode, bw = box.clientWidth, bh = box.clientHeight;
      if (state.d === 'phone') {
        var w = Math.min(PHONE.w, bw - 24), s = w / PHONE.w;
        f.style.width = PHONE.w + 'px'; f.style.height = ((bh - 24) / s) + 'px'; f.style.transform = 'scale(' + s + ')';
      } else {
        var sc = bw / DESK.w;
        f.style.width = DESK.w + 'px'; f.style.height = (bh / sc) + 'px'; f.style.transform = 'scale(' + sc + ')';
      }
    });
  }
  function render() {
    press('dev', 'data-d', state.d); press('pick', 'data-p', state.p);
    stage.classList.toggle('phone', state.d === 'phone');
    document.getElementById('editLabel').textContent = NAMES[state.v];
    document.getElementById('paneOrig').classList.toggle('offstage', state.p !== 'orig');
    document.getElementById('paneEdit').classList.toggle('offstage', state.p !== 'edit');
    var want = 'edited.html#' + state.v;
    if (fEdit.getAttribute('src') !== want) fEdit.setAttribute('src', want);
    try { localStorage.setItem('cc-compare', JSON.stringify(state)); } catch (e) {}
    requestAnimationFrame(fit);
  }

  document.getElementById('dev').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.d = b.getAttribute('data-d'); render(); } });
  document.getElementById('pick').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.p = b.getAttribute('data-p'); render(); } });
  window.addEventListener('resize', fit);

  // scroll together: match the other page by how far down it is, as a share of its length
  var sync = document.getElementById('sync'), lock = false;
  function hook(src, dst) {
    try {
      src.contentWindow.addEventListener('scroll', function () {
        if (!sync.checked || lock) return;
        var a = src.contentDocument.documentElement, b = dst.contentDocument.documentElement;
        var r = src.contentWindow.scrollY / Math.max(1, a.scrollHeight - src.contentWindow.innerHeight);
        lock = true; dst.contentWindow.scrollTo(0, r * (b.scrollHeight - dst.contentWindow.innerHeight));
        setTimeout(function () { lock = false; }, 60);
      }, { passive: true });
    } catch (e) {}
  }
  fOrig.addEventListener('load', function () { hook(fOrig, fEdit); });
  fEdit.addEventListener('load', function () { hook(fEdit, fOrig); });

  render();
})();
</script>

</body>
</html>
